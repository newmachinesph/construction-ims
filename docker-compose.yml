services:
  postgres:
    image: postgres:18-alpine
    container_name: ims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ims_dev_password
      POSTGRES_DB: ims
      # Manila-local reporting; storage is still timestamptz (UTC).
      TZ: Asia/Manila
      PGTZ: Asia/Manila
    ports:
      - "5433:5432"
    volumes:
      # PG18 images store data in a version subdir; mount the parent, not /data.
      - ims_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ims_pgdata:
